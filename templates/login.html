<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Reconciliation Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-zinc-900">
    <div class="glow-card p-4" style="width: 100%; max-width: 400px;">
        <div class="spotlight"></div>
        <div class="position-relative vc-z1">
            <div class="d-flex align-items-center gap-2 mb-3">
                <span class="vc-dot-ok"></span>
                <span class="vc-mono fs-8 text-zinc-400 fw-semibold">ISOLATED DB WORKSPACE</span>
            </div>
            <h4 class="fw-bold text-navy vc-track mb-1">System Login</h4>
            <p class="fs-8 text-zinc-400 mb-4">Sign in to mount your dedicated disk-backed DuckDB instance.</p>

            {% if error %}
            <div class="p-2 mb-3 rounded border border-red-500-40 bg-red-950-40 text-danger fs-8 vc-mono">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label fs-8 fw-semibold text-zinc-200 mb-1">Username</label>
                    <input type="text" name="username" class="vc-input px-3 py-2" placeholder="admin" required
                        autofocus>
                </div>
                <div>
                    <label class="form-label fs-8 fw-semibold text-zinc-200 mb-1">Password</label>
                    <input type="password" name="password" class="vc-input px-3 py-2" placeholder="••••••••" required>
                </div>
                <button type="submit" class="vc-btn w-100 mt-2 py-2">
                    Sign In & Initialize DB
                </button>
            </form>
        </div>
    </div>
    <script src="/static/spotlight.js"></script>
</body>
</html>
